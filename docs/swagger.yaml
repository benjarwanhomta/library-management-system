swagger: "2.0"
basePath: /api/v1
host: localhost:3000
info:
  contact:
    email: support@swagger.io
    name: API Support
    url: http://www.swagger.io/support
  description: This is a sample server for demonstrating Swagger API with Go and Fiber
  termsOfService: http://swagger.io/terms/
  title: Go Swagger Example API
  version: "1.0"
paths:
  /add_book:
    post:
      description: "เพิ่มข้อมูลหนังสือ"
      summary: "เพิ่มข้อมูลหนังสือ"
      parameters:
        - in: body
          name: book
          description: "ข้อมูลหนังสือที่ต้องการเพิ่ม"
          required: true
          schema:
            $ref: "#/definitions/addBookReq"
      responses:
        200:
          description: "OK"
          content:
            application/json:
              schema:
                $ref: "#/definitions/globalResponse"

  /detail_book/{book_id}:
    get:
      description: "ดึงรายละเอียดข้อมูลหนังสือ"
      summary: "ดึงรายละเอียดข้อมูลหนังสือตาม book_id"
      parameters:
        - name: book_id
          in: path
          description: "ID ของหนังสือ"
          required: true
          type: integer
      responses:
        200:
          description: "ข้อมูลหนังสือ"
          content:
            application/json:
              schema:
                $ref: "#/definitions/bookDetailResponse"

definitions:
  globalResponse:
    type: object
    properties:
      message:
        type: string
      status:
        type: string
      value:
        type: object

  bookDetailResponse:
    type: object
    properties:
      book_id:
        type: integer
        example: 2
      title:
        type: string
        example: "หนังสือ A"
      author_id:
        type: integer
        example: 1
      category_id:
        type: integer
        example: 2
      publish_year:
        type: integer
        example: 2020
      isbn:
        type: string
        example: "9783-16-148410-0"
      description:
        type: string
        example: "คำอธิบายของหนังสือ A"
      available_qty:
        type: integer
        example: 5
      Author:
        type: object
        properties:
          author_id:
            type: integer
            example: 1
          name:
            type: string
            example: "จุฑามาศ พันธ์เจริญ"
          biography:
            type: string
            example: "ผู้แต่งนิยายและบทความด้านสังคมศาสตร์ มีผลงานมากมายในด้านการศึกษาประวัติศาสตร์และวัฒนธรรมไทย"
      Category:
        type: object
        properties:
          category_id:
            type: integer
            example: 2
          category_name:
            type: string
            example: "วิทยาศาสตร์"

  addBookReq:
    type: object
    properties:
      title:
        type: string
      author_id:
        type: integer
      category_id:
        type: integer
      publish_year:
        type: integer
      isbn:
        type: string
      description:
        type: string
      available_qty:
        type: integer
    required:
      - title
      - author_id
      - category_id
      - publish_year
      - isbn
      - description
      - available_qty
